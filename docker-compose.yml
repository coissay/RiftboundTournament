services:
  app:
    build: .
    container_name: riftbound-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      # SESSION_SECRET: change-moi-en-prod
      # ADMIN_USERS: alice,bob        # pseudos ayant la main sur tous les tournois (rouvrir, clôturer…)
      # AUTO_CLOSE_DAYS: 7            # clôture automatique des tournois en attente depuis N jours
      # SMTP_URL: smtp://user:pass@smtp.exemple.fr:587   # envoi des invitations aux joueurs sans compte (sinon lien affiché à l'organisateur)
      # MAIL_FROM: Riftbound Tournois <no-reply@exemple.fr>
      # BASE_URL: http://192.168.69.178:3000             # adresse publique utilisée dans les liens des e-mails
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: riftbound-mongo
    restart: unless-stopped
    # Mongo n'a pas de mot de passe : il ne doit JAMAIS être joignable depuis l'extérieur.
    # Le port n'est publié que sur l'interface locale de la machine (debug mongosh, dev hors
    # Docker) ; l'app y accède par le réseau interne Docker. Sur un serveur, supprime même
    # ces deux lignes si tu n'en as pas besoin.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
